<!DOCTYPE html>
<html>
<head>
<title>Memories</title>

<style>
body {
    margin:0;
    background:black;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1 {
    margin-top:20px;
}

.gallery {
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap:10px;
    padding:15px;
}

.gallery img {
    width:100%;
    border-radius:10px;
    transition:0.3s;
}

.gallery img:hover {
    transform: scale(1.05);
}

a {
    display:inline-block;
    margin:20px;
    color:white;
    text-decoration:none;
}
</style>
</head>

<body>

<h1>Memories</h1>

<div class="gallery">
    <img src="https://raw.githubusercontent.com/ch-rvs/ch-rvs/main/IMG_2620.jpeg">
    <img src="https://raw.githubusercontent.com/ch-rvs/ch-rvs/main/IMG_1775.jpeg">
    <img src="https://raw.githubusercontent.com/ch-rvs/ch-rvs/main/IMG_2616.jpeg">
</div>

<a href="index.html">Back</a>

</body>
</html>
