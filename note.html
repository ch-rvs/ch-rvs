<!DOCTYPE html>
<html>
<head>
<title>Our Notes</title>

<style>
body {
    background: black;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 20px;
}

textarea {
    width: 90%;
    max-width: 400px;
    height: 100px;
    margin-top: 10px;
}

button {
    margin-top: 10px;
    padding: 8px 15px;
    cursor: pointer;
}

.note {
    background: #111;
    margin: 10px auto;
    padding: 10px;
    max-width: 400px;
}
</style>
</head>

<body>

<h1>Our Notes</h1>

<textarea id="noteInput" placeholder="Write something..."></textarea><br>
<button onclick="addNote()">Save</button>

<div id="notes"></div>

<br>
<a href="index.html">Back</a>

<script>
let notes = [];

function loadNotes() {
    let saved = localStorage.getItem("notes");
    if (saved) {
        notes = JSON.parse(saved);
        showNotes();
    }
}

function showNotes() {
    let container = document.getElementById("notes");
    container.innerHTML = "";

    for (let i = 0; i < notes.length; i++) {
        let div = document.createElement("div");
        div.className = "note";
        div.innerText = notes[i];
        container.appendChild(div);
    }
}

function addNote() {
    let input = document.getElementById("noteInput");
    let text = input.value;

    if (text === "") return;

    notes.push(text);
    localStorage.setItem("notes", JSON.stringify(notes));

    input.value = "";
    showNotes();
}

loadNotes();
</script>

</body>
</html>
