<!DOCTYPE html>
<html>
<head>
<title>Our Notes</title>

<style>
body {
    background: black;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 20px;
}

textarea {
    width: 90%;
    max-width: 400px;
    height: 100px;
    margin-top: 10px;
}

button {
    margin: 5px;
    padding: 6px 12px;
    cursor: pointer;
}

.note {
    background: #111;
    margin: 10px auto;
    padding: 10px;
    max-width: 400px;
    text-align: left;
    border-radius: 6px;
}

.actions {
    margin-top: 5px;
}
</style>
</head>

<body>

<h1>Our Notes</h1>

<textarea id="noteInput" placeholder="Write something..."></textarea><br>
<button onclick="addNote()">Save</button>

<div id="notes"></div>

<br>
<a href="index.html">Back</a>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];

function renderNotes() {
    const container = document.getElementById("notes");
    container.innerHTML = "";

    notes.forEach((note, index) => {
        const div = document.createElement("div");
        div.className = "note";

        div.innerHTML = `
            <div>${note}</div>
            <div class="actions">
                <button onclick="editNote(${index})">Edit</button>
                <button onclick="deleteNote(${index})">Delete</button>
            </div>
        `;

        container.appendChild(div);
    });
}

function addNote() {
    const input = document.getElementById("noteInput");
    const text = input.value.trim();

    if (text === "") return;

    notes.push(text);
    localStorage.setItem("notes", JSON.stringify(notes));

    input.value = "";
    renderNotes();
}

function deleteNote(index) {
    notes.splice(index, 1);
    localStorage.setItem("notes", JSON.stringify(notes));
    renderNotes();
}

function editNote(index) {
    const newText = prompt("Edit your note:", notes[index]);

    if (newText !== null && newText.trim() !== "") {
        notes[index] = newText;
        localStorage.setItem("notes", JSON.stringify(notes));
        renderNotes();
    }
}

renderNotes();
</script>

</body>
</html>
