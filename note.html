<!DOCTYPE html>
<html>
<head>
<title>Our Notes</title>

<style>
body {
    margin:0;
    background:black;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

h1 {
    margin-bottom:20px;
}

textarea {
    width:90%;
    max-width:500px;
    height:120px;
    border-radius:10px;
    padding:10px;
    border:none;
}

button {
    margin-top:10px;
    padding:10px 20px;
    border:none;
    background:white;
    color:black;
    border-radius:6px;
    cursor:pointer;
}

.notes {
    margin-top:30px;
}

.note {
    background:#111;
    padding:10px;
    margin:10px auto;
    max-width:500px;
    border-radius:10px;
    text-align:left;
}
</style>
</head>

<body>

<h1>Our Notes</h1>

<textarea id="noteInput" placeholder="Write something..."></textarea><br>
<button onclick="addNote()">Save Note</button>

<div class="notes" id="notes"></div>

<a href="index.html">Back</a>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];

function displayNotes() {
    const container = document.getElementById("notes");
    container.innerHTML = "";

    notes.forEach(n => {
        const div = document.createElement("div");
        div.className = "note";
        div.innerText = n;
        container.appendChild(div);
    });
}

function addNote() {
    const input = document.getElementById("noteInput");
    const text = input.value;

    if (text.trim() === "") return;

    notes.push(text);
    localStorage.setItem("notes", JSON.stringify(notes));

    input.value = "";
    displayNotes();
}

displayNotes();
</script>

</body>
</html>
