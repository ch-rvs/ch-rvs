<!DOCTYPE html>
<html>
<head>
<title>Our Time</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- INTRO SCREEN -->
<div id="intro">
    <h1>For You ❤️</h1>
    <button onclick="enterSite()">Enter</button>
</div>

<!-- PASSWORD -->
<div id="lockScreen">
    <h2>Enter Password</h2>
    <input id="pass" type="password">
    <button onclick="checkPass()">Unlock</button>
</div>

<!-- MAIN -->
<div id="main">

<div class="bg"></div>
<canvas id="hearts"></canvas>

<h1 class="title">Our Time Together</h1>

<div id="counter"></div>

<div class="typing" id="note1"></div>
<div class="typing" id="note2"></div>

<!-- SLIDER -->
<div class="slider" id="slider">
    <img src="IMG_2620.jpeg">
    <img src="IMG_1775.jpeg">
    <img src="IMG_2616.jpeg">
</div>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

</div>

<script src="script.js"></script>
</body>
</html>
