<!DOCTYPE html>
<html>
<head>
  <title>Shimray🔥</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0f2027, #2c5364);
      color: white;
      text-align: center;
    }

    header {
      padding: 20px;
      font-size: 24px;
      background: rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 40px;
      margin-top: 50px;
      color: cyan;
    }

    p {
      font-size: 18px;
      opacity: 0.8;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 25px;
      background: cyan;
      color: black;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: white;
      transform: scale(1.1);
    }

    .card {
      margin: 40px auto;
      padding: 20px;
      width: 80%;
      max-width: 300px;
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
    }
  </style>
</head>

<body>

<header>
  🚀 Shimray's Website
</header>

<h1>Welcome 😎</h1>
<p>This is my upgraded site 🔥</p>

<button onclick="showMessage()">Click Me</button>

<div class="card">
  <h3>About Me</h3>
  <p>I build websites from my phone 📱</p>
</div>

<script>
  function showMessage() {
    alert("🔥 You're now interacting with my website!");
  }
</script>

</body>
</html>
